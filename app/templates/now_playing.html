<svg width="500" height="40" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <foreignObject width="500" height="40">
        <div xmlns="http://www.w3.org/1999/xhtml" class="container">
            <style>
                html, body, div, span, h1, p, a, img {
                    margin: 0;
                    padding: 0;
                    border: 0;
                    font-size: 100%;
                    font: inherit;
                }
                .container {
                    {% if background %}background-color: {{ background }};{% endif %}
                    border-radius: 5px;
                    padding: 4px 6px;
                    box-sizing: border-box;
                }
                main {
                    display: flex;
                    align-items: center;
                }
                p {
                    margin-top: 0px;
                    font-size: 18px;
                    font-weight: 500;
                    white-space: nowrap;
                    text-overflow: ellipsis;
                    display: block;
                    overflow: hidden;
                    max-width: 260px;
                }
                .logo {
                    width: 20px;
                    height: 20px;
                    padding-left: 0px;
                }
                .bar-container {
                    display: flex;
                    animation: rainbow 0ms -800ms linear infinite;
                }
                .content {
                    display: inline;
                    padding-left: 6px;
                    padding-right: 6px;
                }
                .desc {
                    color: {{ accent_color }};
                    display: inline;
                    font-size: small;
                    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
                }
                .details {
                    font-style: italic;
                    color: {{ text_color }};
                    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
                }
                .bar {
                    border-radius: 3px 3px 0 0;
                    height: 9px;
                    transform-origin: bottom;
                    animation: resize 0ms -800ms ease-in-out infinite alternate;
                    width: 3px;
                }
                .bar:not(:first-child) {
                    margin-left: 1px;
                }
                @keyframes resize {
                    0% {
                        transform: scaleY(0);
                        opacity: .05;
                    } 100% {
                        transform: scaleY(1);
                        opacity: .95;
                    }
                }
                .progress-row {
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    padding-top: 4px;
                }
                .progress-track {
                    flex: 1;
                    height: 4px;
                    border-radius: 2px;
                    background: {{ muted_color }};
                    overflow: hidden;
                }
                .progress-fill {
                    height: 100%;
                    background: {{ accent_color }};
                    width: {{ progress_percent }}%;
                }
                .time {
                    font-size: 10px;
                    color: {{ muted_color }};
                    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
                    white-space: nowrap;
                }
            </style>
            <main>
                <img class="logo" src="data:image/png;base64, {{logo}}" alt="Spotify Logo" />
                <div class="content">
                    <p class="desc">Listening to <span class="details">{{song}}</span>{% if artist %} by <span class="details">{{artist}}</span>{% endif %} on Spotify</p>
                </div>
                <div class="bar-container">
                    {{bars|safe}}
                </div>
            </main>
            {% if progress_percent is not none %}
            <div class="progress-row">
                <span class="time">{{elapsed}}</span>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <span class="time">{{total}}</span>
            </div>
            {% endif %}
        </div>
    </foreignObject>
</svg>
